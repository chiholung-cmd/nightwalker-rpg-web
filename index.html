<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">

<title>IA 入境事務助理｜考前溫習器</title>
<style>
:root{--navy:#0b2d5b;--blue:#0b5fc6;--blue2:#eaf3ff;--line:#dce8f7;--bg:#f4f8fd;--card:#fff;--text:#17233a;--muted:#65748b;--green:#16865c;--greenbg:#e8f7f0;--amber:#b56b00;--amberbg:#fff5df;--red:#b73a3a;--redbg:#fff0f0;--shadow:0 10px 30px rgba(26,65,119,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;line-height:1.55}button,input,select,textarea{font:inherit}a{color:var(--blue);text-decoration:none}.app{max-width:1120px;margin:auto;padding:18px 16px 80px}.hero{background:linear-gradient(135deg,#0a356d,#0b64c8);color:#fff;border-radius:22px;padding:24px;box-shadow:var(--shadow)}.hero h1{margin:0 0 5px;font-size:clamp(24px,5vw,38px);line-height:1.16}.hero p{margin:0;opacity:.88}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:12px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;opacity:.86}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0 12px;padding-bottom:2px}.tab{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:12px;white-space:nowrap;color:var(--navy);cursor:pointer;font-weight:700}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.panel{display:none}.panel.active{display:block}.toolbar{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:8}.filters{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px}input,select,textarea{border:1px solid #cddced;border-radius:11px;background:#fff;padding:10px 11px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:#6ba6e8;box-shadow:0 0 0 3px #e8f3ff}.btn{border:0;border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:750}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:var(--blue2);color:var(--navy)}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn.good{background:var(--greenbg);color:var(--green)}.btn.warn{background:var(--amberbg);color:var(--amber)}.btn.bad{background:var(--redbg);color:var(--red)}.meta-line{display:flex;justify-content:space-between;align-items:center;margin:13px 2px 8px;color:var(--muted);font-size:13px}.cards{display:grid;gap:10px}.qa{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(27,61,111,.045)}.qa summary{list-style:none;padding:15px;cursor:pointer}.qa summary::-webkit-details-marker{display:none}.rowtop{display:flex;gap:8px;align-items:flex-start}.badge{font-size:11px;font-weight:800;border-radius:999px;padding:4px 8px;white-space:nowrap}.badge.a{background:#e9f2ff;color:#0b57ad}.badge.b{background:#f1f4f8;color:#506176}.badge.cat{background:#f6f2ff;color:#6841a8}.qtext{font-size:16px;font-weight:800;flex:1}.state-dot{width:9px;height:9px;border-radius:50%;background:#c9d4e1;margin-top:7px}.state-dot.mastered{background:var(--green)}.state-dot.review{background:#e7a21a}.answer{border-top:1px solid var(--line);padding:15px;background:#fbfdff}.answer h4{margin:0 0 5px;color:var(--navy);font-size:13px}.answer p{margin:0 0 13px;white-space:pre-wrap}.keybox{background:#eef6ff;border-left:4px solid #3a84d8;padding:10px 12px;border-radius:8px;margin:8px 0 13px}.follow{background:#fff8e8;border-left:4px solid #e0a12a;padding:10px 12px;border-radius:8px}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.source{font-size:12px;color:var(--muted);margin-top:12px;display:flex;gap:9px;flex-wrap:wrap}.flash-wrap{max-width:760px;margin:18px auto}.flash{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;min-height:390px;box-shadow:var(--shadow);display:flex;flex-direction:column}.flash .bigq{font-size:clamp(22px,5vw,31px);font-weight:850;line-height:1.35;margin:22px 0}.flash-answer{display:none;border-top:1px solid var(--line);padding-top:18px;margin-top:8px}.flash-answer.show{display:block}.flash-nav{display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:18px}.progressbar{height:8px;background:#e6edf6;border-radius:99px;overflow:hidden;margin-top:8px}.progressbar i{display:block;height:100%;background:var(--blue);width:0}.quiz{max-width:780px;margin:18px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.quiz textarea{width:100%;min-height:130px;resize:vertical}.quiz-answer{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:15px}.quiz-answer.show{display:block}.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.empty{text-align:center;padding:50px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin:28px 0}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.toolbar{top:5px}.app{padding:10px 10px 70px}.hero{padding:20px 18px;border-radius:18px}.flash,.quiz{padding:18px}.flash-nav{flex-wrap:wrap}}
</style></head>
<body><div class="app">
<section class="hero"><h1>IA 入境事務助理｜考前溫習器</h1><p>高命中知識庫 · A必背 + B熟悉 · 最後整理：2026-08-27</p>
<div class="stats"><div class="stat"><b id="totalCount">101</b><span>高命中題目</span></div><div class="stat"><b>43</b><span>A 必背</span></div><div class="stat"><b>58</b><span>B 熟悉</span></div><div class="stat"><b id="masteredCount">0</b><span>已掌握</span></div></div></section>
<nav class="tabs"><button class="tab active" data-tab="list">📚 題庫溫習</button><button class="tab" data-tab="flash">🃏 卡片模式</button><button class="tab" data-tab="quiz">🎯 快問快答</button><button class="tab" data-tab="progress">📈 我的進度</button></nav>

<section id="list" class="panel active"><div class="toolbar"><div class="filters"><input class="search" id="search" placeholder="搜尋問題、答案或重點…"><select id="priorityFilter"><option value="">A + B 全部</option><option value="A">只看 A 必背</option><option value="B">只看 B 熟悉</option></select><select id="categoryFilter"><option value="">全部類別</option></select><button class="btn secondary" id="onlyReview">只看未熟</button></div></div><div class="meta-line"><span id="resultMeta"></span><button class="btn ghost" id="expandAll">展開全部答案</button></div><div class="cards" id="cards"></div></section>

<section id="flash" class="panel"><div class="toolbar"><div class="filters"><select id="flashPriority"><option value="">A + B</option><option value="A">A 必背</option><option value="B">B 熟悉</option></select><select id="flashCategory"><option value="">全部類別</option></select><button class="btn secondary" id="shuffleFlash">隨機排序</button><button class="btn ghost" id="flashUnmastered">優先未熟</button></div></div><div class="flash-wrap"><div class="flash"><div><div id="flashMeta" class="small"></div><div class="progressbar"><i id="flashProgress"></i></div><div id="flashQuestion" class="bigq"></div><button class="btn primary" id="revealFlash">顯示答案</button> <button class="btn ghost" id="speakFlash">🔊 朗讀問題</button><div id="flashAnswer" class="flash-answer"></div></div><div class="flash-nav"><button class="btn ghost" id="prevFlash">← 上一題</button><div><button class="btn warn" id="reviewFlash">要再溫</button> <button class="btn good" id="masterFlash">已掌握 ✓</button></div><button class="btn ghost" id="nextFlash">下一題 →</button></div></div></div></section>

<section id="quiz" class="panel"><div class="toolbar"><div class="filters"><select id="quizPriority"><option value="A">A 必背</option><option value="">A + B</option><option value="B">B 熟悉</option></select><select id="quizCategory"><option value="">全部類別</option></select><select id="quizCount"><option value="10">10題</option><option value="20">20題</option><option value="30">30題</option></select><button class="btn primary" id="startQuiz">開始新一輪</button></div></div><div class="quiz"><div id="quizMeta" class="small">按「開始新一輪」開始。</div><div id="quizQuestion" style="font-size:23px;font-weight:850;margin:14px 0"></div><textarea id="quizInput" placeholder="先用自己說法答；亦可以直接口答，之後再揭答案比較。"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" id="quizReveal">顯示標準答案</button><button class="btn ghost" id="quizSpeak">🔊 朗讀問題</button></div><div id="quizAnswer" class="quiz-answer"></div><div id="quizScore" class="score-row" style="display:none"><button class="btn good" data-score="2">✅ 答到</button><button class="btn warn" data-score="1">🟡 部分識</button><button class="btn bad" data-score="0">❌ 未識</button></div></div></section>

<section id="progress" class="panel"><div class="quiz"><h2 style="margin-top:0">我的溫習進度</h2><div class="stats" style="color:var(--text)"><div class="stat" style="background:#eef6ff"><b id="pMastered">0</b><span>已掌握</span></div><div class="stat" style="background:#fff5df"><b id="pReview">0</b><span>要再溫</span></div><div class="stat" style="background:#f3f6fa"><b id="pNew">0</b><span>未標記</span></div><div class="stat" style="background:#eef9f4"><b id="quizAccuracy">-</b><span>自評答到率</span></div></div><h3>建議次序</h3><p>① 先完成 A 必背 → ② 用「快問快答」測自己 → ③ 將「部分識／未識」標記為要再溫 → ④ 最後補 B 熟悉。</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" id="exportProgress">匯出進度 JSON</button><button class="btn bad" id="resetProgress">清除本機進度</button></div><p class="small">進度只儲存在目前瀏覽器的 localStorage；HTML本身不會上傳你的答案。</p></div></section>
<div class="footer-note">資料以題庫所列官方來源為準；時效性政策請於正式面試前再核實。</div></div>

<script>
const DATA=[{"id": "INFO-001", "category": "部門基本資料", "priority": "A 必背", "question": "入境事務處幾時成立？", "answer": "入境事務處於1961年8月4日成立，成立初期只有約200名員工。2026年是入境處成立65周年。這個日期適合作為部門歷史最基本的必背資料。", "key": "1961-08-04；2026=65周年", "followup": "入境處成立至今最大的轉變是甚麼？", "nature": "歷史", "verified": "46261", "source": "https://www.immd.gov.hk/publications/a_report_2016/en/55th.html"}, {"id": "INFO-002", "category": "部門基本資料", "priority": "A 必背", "question": "現任入境事務處處長是誰？", "answer": "截至2026年8月，入境事務處處長是郭俊峯。處長負責入境事務的整體管理及制定相關政策，並兼任人事登記處處長、生死登記官及婚姻登記官。", "key": "郭俊峯；整體管理；政策；兼任三項法定職能", "followup": "你認為處長最重要的責任是甚麼？", "nature": "現況", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/about-us/organisation/organisation-chart/immd.html"}, {"id": "INFO-003", "category": "部門基本資料", "priority": "B 熟悉", "question": "入境處現時有幾多人？", "answer": "截至2026年8月1日，入境處共有8,505名人員，其中7,095名為入境事務隊人員，1,410名為文職人員。面試時記住總數及紀律人員數目即可。", "key": "總計8,505；入境事務隊7,095；文職1,410", "followup": "這個人員規模反映入境處工作有甚麼特點？", "nature": "統計", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/about-us/establishment.html"}, {"id": "INFO-004", "category": "部門基本資料", "priority": "B 熟悉", "question": "入境處總部在哪裏？幾時搬遷？", "answer": "入境處總部在新界將軍澳寶邑路61號。新總部於2024年6月11日正式啟用，由灣仔入境事務大樓遷入。新總部由行政大樓及執法大樓組成，反映部門服務與執法並重。", "key": "將軍澳寶邑路61號；2024-06-11；行政大樓+執法大樓", "followup": "為何入境處需要同時重視服務與執法？", "nature": "歷史／現況", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20240606.html"}, {"id": "INFO-005", "category": "部門基本資料", "priority": "A 必背", "question": "入境處的理想是甚麼？", "answer": "入境處的理想是成為世界上以能幹和效率稱冠的入境事務隊伍。回答時除了背句子，最好理解背後代表專業、效率、科技應用及持續改善服務。", "key": "世界上以能幹和效率稱冠", "followup": "你如何理解「能幹和效率」？", "nature": "理念", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/about-us/mission.html"}, {"id": "INFO-006", "category": "部門基本資料", "priority": "A 必背", "question": "入境處的主要使命包括甚麼？", "answer": "入境處的使命包括：有效執行出入境管制並便利真正旅客、拒絕不受歡迎人物入境；協助在境外身陷困境的香港居民；防範恐怖活動並防止及偵查與出入境有關罪行；簽發高度防偽的身份證及旅行證件；提供高效率的人事及出生、死亡、婚姻登記服務；以及提供入境便利以匯聚人才。", "key": "管制；境外支援；反恐及罪案；證件；登記；吸引人才", "followup": "哪一項使命與IA前線工作最直接相關？", "nature": "理念", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/about-us/mission.html"}, {"id": "INFO-007", "category": "部門基本資料", "priority": "A 必背", "question": "入境處的信念有哪幾項？", "answer": "入境處現行信念包括六方面：愛國愛港、堅定不移；正直誠信、公正無私；以禮待人、體恤市民；關顧共融、群策群力；觸覺敏銳、因時制宜；精益求精、樹立榜樣。面試時最值得連結到IA的是紀律、誠信、公正、服務及團隊精神。", "key": "六項信念；誠信、公正、服務、團隊、應變、進步", "followup": "哪一項信念最適合形容你？", "nature": "理念", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/about-us/mission.html"}, {"id": "INFO-008", "category": "部門基本資料", "priority": "B 熟悉", "question": "入境處的主要組織架構是怎樣？", "answer": "入境處由處長領導，下設兩名副處長，分別負責「管制、簽證及證件」及「執法、系統及管理」。主要部門包括管制部、簽證及政策部、個人證件部、執法部、遣送審理及訴訟部、資訊系統部、管理及支援部，另設部門管理科。", "key": "2名副處長；7個主要部門+部門管理科", "followup": "IA可能在哪些部門工作？", "nature": "架構", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/about-us/organisation/organisation-chart/immd.html"}, {"id": "INFO-009", "category": "管制站", "priority": "A 必背", "question": "香港有幾多個主要出入境管制站？", "answer": "截至2026年8月，香港有13個主要出入境管制站，以及2個主要港口管制點。13個主要管制站包括機場、羅湖、落馬洲、落馬洲支線、文錦渡、沙頭角、中國客運碼頭、港澳客輪碼頭、深圳灣、啟德郵輪碼頭、高鐵西九龍、港珠澳大橋及香園圍。", "key": "13個主要管制站+2個港口管制點", "followup": "你可以按海陸空把管制站分類嗎？", "nature": "現況", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/services/control_point_contact_details.html"}, {"id": "INFO-010", "category": "管制站", "priority": "B 熟悉", "question": "兩個主要港口管制點是甚麼？", "answer": "兩個主要港口管制點是港口管制組及位於屯門的內河碼頭。港口管制工作主要處理船舶及海路出入境相關檢查。", "key": "港口管制組；內河碼頭", "followup": "海路管制與一般客運碼頭工作有甚麼不同？", "nature": "現況", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/services/control_point_contact_details.html"}, {"id": "INFO-011", "category": "管制站", "priority": "B 熟悉", "question": "管制部如何分工？", "answer": "現時管制部下有機場科、邊境管制科、落馬洲科及跨境大橋科。機場科負責機場；邊境管制科負責香園圍、羅湖、文錦渡、沙頭角、中國客運碼頭、高鐵西九龍及啟德郵輪碼頭；落馬洲科負責落馬洲及落馬洲支線；跨境大橋科負責深圳灣、內河碼頭、港珠澳大橋、港澳客輪碼頭及港口。", "key": "4個主要分科及所屬管制站", "followup": "如果你被派到繁忙陸路口岸，最重要能力是甚麼？", "nature": "架構", "verified": "46261", "source": "https://www.immd.gov.hk/eng/about-us/organisation/organisation-chart/control.html"}, {"id": "INFO-014", "category": "管制站歷史", "priority": "B 熟悉", "question": "高鐵西九龍管制站幾時啟用？有何特色？", "answer": "高鐵西九龍管制站於2018年9月23日正式啟用，採用「一地兩檢」模式，跨境旅客可以在香港西九龍站內同時完成香港及內地的出入境手續。", "key": "2018-09-23；一地兩檢", "followup": "高鐵口岸與傳統陸路口岸在旅客管理上有何不同？", "nature": "歷史", "verified": "46261", "source": "https://www.immd.gov.hk/publications/a_report_2023/tc/chapter3.html"}, {"id": "INFO-015", "category": "管制站歷史", "priority": "B 熟悉", "question": "港珠澳大橋管制站幾時開始服務？", "answer": "港珠澳大橋香港口岸管制站於2018年10月24日開始提供服務，是香港連接澳門及珠海的重要跨境陸路口岸，處理旅客及跨境車輛出入境手續。", "key": "43397", "followup": "港珠澳大橋對香港出入境管理有何重要性？", "nature": "歷史", "verified": "46261", "source": "https://www.immd.gov.hk/publications/a_report_2020/tc/appendix9.html"}, {"id": "INFO-016", "category": "管制站歷史", "priority": "B 熟悉", "question": "香園圍管制站幾時啟用？", "answer": "香園圍邊境管制站於2020年8月26日正式啟用，最初只提供貨運通關服務；在香港與內地全面恢復正常往來後，於2023年2月6日起全面投入運作，包括旅客、私家車及跨境巴士通關。", "key": "2020-08-26貨運；2023-02-06全面客運", "followup": "為何新口岸會分階段啟用？", "nature": "歷史", "verified": "46261", "source": "https://www.immd.gov.hk/publications/a_report_2023/tc/service.html"}, {"id": "INFO-017", "category": "管制站歷史", "priority": "B 熟悉", "question": "疫情期間及之後管制站重開的重要日期是甚麼？", "answer": "因應疫情，多個管制站在2020年1月底及2月初暫停客運。香港與內地由2023年1月8日起分階段恢復正常往來，2023年2月6日起全面通關，羅湖、落馬洲等恢復服務，香園圍亦開始全面客運通關。", "key": "2020暫停；2023-01-08分階段；2023-02-06全面通關", "followup": "如果再次遇到大型公共衞生事件，管制站應如何平衡安全與便利？", "nature": "歷史／危機管理", "verified": "46261", "source": "https://www.immd.gov.hk/publications/a_report_2023/tc/service.html"}, {"id": "INFO-018", "category": "最新統計", "priority": "B 熟悉", "question": "2025年香港總出入境人次是多少？", "answer": "2025年香港各管制站總出入境人次約3.35億，較2024年增加約12%，並創有紀錄以來新高。同期訪港旅客入境約4,989萬人次，其中內地旅客約3,783萬人次。", "key": "3.35億；+12%；訪港4,989萬；內地3,783萬", "followup": "旅客量上升對前線IA最大的挑戰是甚麼？", "nature": "統計", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-019", "category": "IA職務", "priority": "A 必背", "question": "入境事務助理員主要做甚麼？", "answer": "入境事務助理員主要執行與入境、人事登記、生死及婚姻登記等香港法例有關的職務，以及行動工作。實際工作包括一般搜查、看管、護送、巡邏、接待、駕駛等，亦包括偵查偽造證件等工作。", "key": "入境；登記；搜查；看管；護送；巡邏；接待；駕駛；偽證", "followup": "哪一項工作你認為最具挑戰？", "nature": "職位認知", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/recruitment/"}, {"id": "INFO-020", "category": "IA職務", "priority": "A 必背", "question": "IA的工作條件有甚麼需要特別接受？", "answer": "IA屬紀律部隊職位，獲聘者須受紀律約束、穿着制服、接受全日制入職訓練及輪班當值；亦可能需要駕駛政府車輛，以及在香港特別行政區以外地方工作。因此投考前要有清晰心理準備，不能只把職位理解為一般櫃位服務工作。", "key": "紀律；制服；輪班；全日制訓練；駕駛；可能境外工作", "followup": "你能否接受夜班、假日工作及突然調派？", "nature": "職位認知", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/recruitment/"}, {"id": "INFO-021", "category": "招聘", "priority": "A 必背", "question": "今輪IA甄選程序是怎樣？", "answer": "按2026年8月公布的安排，體能測驗由2026年8月26日起進行；通過後是初步面試，暫定於2026年11月至12月；再通過後進行筆試，暫定2027年1月；最後面試暫定2027年2月至4月。日期屬官方當時暫定安排，應在臨近階段再核實。", "key": "體能→初步面試→筆試→最後面試", "followup": "你會如何分階段準備整個甄選？", "nature": "招聘現況", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/recruitment/"}, {"id": "INFO-022", "category": "訓練", "priority": "A 必背", "question": "新聘IA要接受多久訓練？", "answer": "新聘任入境事務助理員須在入境事務學院接受約15星期的留宿入職訓練。完成相關訓練後，學員會具備執行前線入境事務及管制工作的基本知識、紀律和技能。", "key": "約15星期；留宿訓練", "followup": "你如何看待留宿及紀律訓練？", "nature": "職位認知", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/recruitment/"}, {"id": "INFO-023", "category": "訓練", "priority": "B 熟悉", "question": "IA入職訓練包括甚麼？", "answer": "訓練理論與實踐並重，包括法律、出入境政策及程序、部門職能及架構，並重視紀律及優質服務。課程亦包括中式步操、戰術及槍械、體能、游泳及急救，以及《憲法》、《基本法》、《香港國安法》、國家體制、公務員信念及公共服務文化等內容。", "key": "法律；政策；步操；戰術槍械；體能；游泳；急救；國情及公共服務", "followup": "你最需要為哪一部分訓練作準備？", "nature": "職位認知", "verified": "46261", "source": "https://www.immd.gov.hk/publications/a_report_2024/tc/chapter1.html"}, {"id": "INFO-024", "category": "法例", "priority": "A 必背", "question": "IA工作最常涉及哪些基本法例？", "answer": "面試層面最值得先記的包括《入境條例》（第115章）、《人事登記條例》（第177章）、《生死登記條例》（第174章）及《婚姻條例》（第181章）。IA實際職務會按崗位及授權執行相關法例及程序，不宜在面試中自行延伸法律權力範圍。", "key": "115；177；174；181", "followup": "為何紀律部隊人員必須嚴格按法例及程序工作？", "nature": "法例", "verified": "46261", "source": "https://www.elegislation.gov.hk/"}, {"id": "INFO-025", "category": "通關科技", "priority": "B 熟悉", "question": "甚麼是e-道？", "answer": "e-道是入境處的自助出入境檢查系統，透過身份核實及生物特徵等技術，讓合資格人士自行辦理出入境檢查，目的在提高通關效率、處理能力及旅客體驗，同時維持身份核實及保安要求。", "key": "e-道=自助通關；效率+保安", "followup": "科技會否完全取代前線IA？", "nature": "科技", "verified": "46261", "source": "https://www.immd.gov.hk/eng/services/echannel_residents.html"}, {"id": "INFO-026", "category": "通關科技", "priority": "B 熟悉", "question": "「非觸式e-道」幾時推出？", "answer": "香港居民「非觸式e-道」於2021年12月1日推出，最初在香港國際機場、港珠澳大橋及深圳灣使用。合資格人士可用流動應用程式產生加密二維碼，再配合容貌識別完成自助通關，減少接觸共用設備。", "key": "2021-12-01；QR code+容貌識別", "followup": "非觸式通關對效率和公共衞生有何好處？", "nature": "科技", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20211130b.html"}, {"id": "INFO-028", "category": "通關科技", "priority": "A 必背", "question": "甚麼是「無感e-道」？幾時推出？", "answer": "「無感e-道」於2026年6月25日在港珠澳大橋香港口岸離境大堂推出。已登記的合資格香港永久居民可透過人工智能及容貌識別，以正常步速不停頓完成離境檢查，過程毋須出示身份證或e-道二維碼，但仍須隨身攜帶有效身份證。", "key": "2026-06-25；港珠澳大橋；不停步；AI+容貌識別", "followup": "無感通關如何同時兼顧速度與保安？", "nature": "科技／最新政策", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260611.html"}, {"id": "INFO-029", "category": "通關科技", "priority": "B 熟悉", "question": "誰可登記「無感e-道」？", "answer": "推出時的資格包括：年滿11歲、持有效智能身份證的香港永久性居民，並在過去90日內經港珠澳大橋香港口岸旅檢大樓出境或入境達10次或以上。11至17歲人士需得到父母或合法監護人同意。", "key": "11歲+；香港永久居民；90日內10次", "followup": "為何會先由頻繁使用口岸人士開始試行？", "nature": "科技／政策", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260611.html"}, {"id": "INFO-030", "category": "通關科技", "priority": "B 熟悉", "question": "2026年經常訪港旅客e-道資格有甚麼放寬？", "answer": "由2026年2月27日起，入境處放寬經常訪港旅客登記e-道的資格。符合相關條件、持有效旅行證件及多次訪港簽證等人士，如在過去24個月經香港國際機場訪港兩次或以上，可免費登記並在香港各管制站使用e-道。", "key": "2026-02-27；24個月內機場2次或以上", "followup": "便利訪客與邊境保安是否有衝突？", "nature": "最新政策", "verified": "46261", "source": "https://www.immd.gov.hk/eng/press/press-releases/20260226.html"}, {"id": "INFO-031", "category": "未來發展", "priority": "A 必背", "question": "入境處未來通關發展方向是甚麼？", "answer": "入境處正推動「智慧入境處」，方向包括更廣泛使用人工智能、容貌識別及新一代身份認證技術，並推進「合作查驗、一次放行」及無感通關等新模式。重點不是單純加快速度，而是在保安、準確、旅客體驗及跨境協作之間取得平衡。", "key": "智慧入境處；AI；合作查驗一次放行；無感通關", "followup": "你認為AI最適合協助IA哪類工作？", "nature": "政策／趨勢", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260401.html"}, {"id": "INFO-032", "category": "人才政策", "priority": "A 必背", "question": "高端人才通行證計劃幾時推出？目的甚麼？", "answer": "高端人才通行證計劃於2022年12月28日推出，目的是吸引高收入人士及世界頂尖大學畢業生來港發展。計劃的一個重要特點是合資格申請人在提出申請時毋須已在香港找到工作。", "key": "2022-12-28；高收入/頂尖大學；申請時毋須已有工作", "followup": "香港為甚麼要透過入境政策搶人才？", "nature": "人才政策", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/services/visas/TTPS.html"}, {"id": "INFO-033", "category": "人才政策", "priority": "B 熟悉", "question": "2025年人才清單有甚麼更新？", "answer": "經更新的「人才清單」於2025年3月生效，加入9項專業後共涵蓋60項本地人才短缺專業。相關人才透過優秀人才入境計劃、一般就業政策或輸入內地人才計劃申請時，可按政策獲相應便利。", "key": "2025年3月；60項專業", "followup": "吸引人才同保障本地就業應如何平衡？", "nature": "人才政策", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-034", "category": "人才政策", "priority": "A 必背", "question": "2025年「技術專才」新渠道有甚麼重點？", "answer": "2025年6月，政府在一般就業政策及輸入內地人才計劃下增設技術專才渠道，涵蓋8項人力極短缺的技術工種。安排為期3年，總申請配額10,000個，每個工種最多3,000個，申請人一般須介乎18至40歲並符合指定資格。", "key": "8工種；3年；總額10,000；每工種最多3,000；18-40歲", "followup": "輸入技術人才如何避免影響本地工人？", "nature": "人才政策", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-035", "category": "人才政策", "priority": "B 熟悉", "question": "新資本投資者入境計劃幾時推出？基本門檻是多少？", "answer": "舊「資本投資者入境計劃」自2015年1月15日起暫停，新資本投資者入境計劃則於2024年3月1日推出。按現行規則，申請人須符合包括年滿18歲、淨資產及投資規定等條件，其中核心金額門檻為不少於3,000萬港元。", "key": "舊計劃2015-01-15暫停；新計劃2024-03-01；3,000萬港元", "followup": "資本投資者計劃對香港有何經濟作用？", "nature": "人才／投資政策", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/faq/newcies.html"}, {"id": "INFO-036", "category": "人才政策", "priority": "B 熟悉", "question": "簽證服務近年如何電子化？", "answer": "入境處持續把簽證及進入許可服務電子化。2025年1月進一步推動電子化申請，申請人可經入境處流動應用程式、入境處網站或政府一站通完成整個申請程序，減少親身前往辦事處的需要。", "key": "2025年1月；App/網站/一站通", "followup": "電子化服務如何改善公共服務？", "nature": "電子服務", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-038", "category": "執法", "priority": "A 必背", "question": "2025年反非法勞工執法有多大規模？", "answer": "2025年入境處進行19,980次反非法勞工行動，較2024年增加約12%；共拘捕3,708名非法勞工及569名本地僱主。這反映打擊非法勞工是入境處持續而高頻的執法工作之一。", "key": "19,980次；3,708非法勞工；569僱主", "followup": "為何打擊黑工屬於保障社會及本地就業的一部分？", "nature": "執法統計", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-039", "category": "執法", "priority": "B 熟悉", "question": "市民如何舉報非法勞工？", "answer": "入境處設有多個舉報渠道。2025年9月推出舉報非法勞工專線3861 5000，亦在微信及「智方便」加入舉報功能，配合電話、電郵及網上平台，強化情報搜集及跨部門打擊非法勞工。", "key": "3861 5000；2025年9月", "followup": "情報在執法工作中有何重要性？", "nature": "最新措施", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-043", "category": "大型行動", "priority": "B 熟悉", "question": "甚麼是「閃刺2025」？", "answer": "2025年11月，入境處與廣東省出入境管理部門展開代號「閃刺2025」的跨境聯合行動，瓦解一個跨境假結婚犯罪集團。行動拘捕集團主腦、骨幹及涉嫌假結婚人士；調查指集團在2023至2024年間安排超過60宗假結婚，涉款超過750萬元。", "key": "2025年11月；跨境假結婚；60+宗；750萬+", "followup": "假結婚為甚麼屬嚴重的入境違法行為？", "nature": "跨境執法", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-044", "category": "大型行動", "priority": "B 熟悉", "question": "甚麼是「逐影」行動？", "answer": "2025年11月6日，入境處執行代號「逐影」的登機押解遣返行動，首次安排免遣返聲請不獲確立者乘特別專機由香港前往廣州白雲機場，再轉乘商業航班回國；該次行動強制遣送6名巴基斯坦籍人士。", "key": "2025-11-06；首次特別專機轉運；6人", "followup": "為何有效遣送是入境管制的重要一環？", "nature": "遣送行動", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-045", "category": "大型行動", "priority": "B 熟悉", "question": "甚麼是「勇光」反恐演習？", "answer": "2025年8月，入境處參與在啟德郵輪碼頭舉行、代號「勇光」的大型跨部門反恐演習，目的是測試及提升不同部門處理涉恐涉暴情報，以及應對不同形式恐怖襲擊時的協調及應變能力。", "key": "2025年8月；啟德；大型跨部門反恐演習", "followup": "大型演習對日常前線工作有甚麼價值？", "nature": "反恐／演習", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-047", "category": "免遣返", "priority": "B 熟悉", "question": "2025年免遣返聲請處理情況如何？", "answer": "2025年入境處就超過2,500宗免遣返聲請作出決定，年底尚待入境處審核約650宗；超過95%的被拒聲請人會提出上訴。同年入境處遣送2,613名聲請不獲確立者離港，較2024年增加18%。", "key": ">2,500決定；約650待審；>95%上訴；2,613遣送", "followup": "免遣返制度為何需要同時重視程序公義及防止濫用？", "nature": "政策／統計", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-049", "category": "境外支援", "priority": "A 必背", "question": "香港居民在外地遇事可如何向入境處求助？", "answer": "香港居民在境外身陷困境可聯絡入境處「協助在外香港居民小組」。24小時求助熱線為(852) 1868；亦可透過入境處流動應用程式、1868聊天機械人、網上求助表格、1868 WhatsApp及微信求助熱線聯絡。入境處會按情況聯同外交部駐港特派員公署及中國駐外使領館提供切實可行協助。", "key": "24小時(852)1868；App；WhatsApp；微信", "followup": "入境處可以及不可以為境外港人做甚麼？", "nature": "公共服務", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/services/Assistance_Outside_Hong_Kong.html"}, {"id": "INFO-050", "category": "境外支援", "priority": "B 熟悉", "question": "2025年協助在外港人的工作有甚麼重要例子？", "answer": "2025年協助在外香港居民小組處理3,388宗求助個案。1月至3月期間，入境處及保安局專責小組先後四次赴泰國協助懷疑被誘騙到東南亞從事非法工作的港人；3月緬甸地震時有兩名入境處人員隨特區救援隊赴災區；6月伊朗與以色列局勢緊張期間，入境處接獲21名身處伊朗、以色列及約旦港人的查詢，最終20人安全離開當地，餘下一人表示安全及毋須進一步協助。", "key": "3,388宗；泰國4次；緬甸地震2名人員；21查詢/20安全離開", "followup": "境外緊急支援最需要哪幾種能力？", "nature": "最新事件", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-051", "category": "大型活動", "priority": "B 熟悉", "question": "2025年全運會期間入境處做了甚麼？", "answer": "為支援第十五屆全國運動會及相關賽事，入境處在機場、高鐵西九龍、港珠澳大橋及深圳灣設置出入境專屬通道，共提供16條e-道予已登記運動員及相關人員使用。跨境公路自行車及馬拉松賽事則採用創新的「前置查驗、閉環管理」安排，以達到零延時、零接觸、零等待的通關目標。", "key": "4個口岸；16條e-道；前置查驗/閉環管理", "followup": "大型國際活動如何考驗入境處跨部門協調？", "nature": "大型活動", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260213.html"}, {"id": "INFO-052", "category": "最新發展", "priority": "A 必背", "question": "2026年入境處有哪些值得面試前特別記住的最新重點？", "answer": "2026年是入境處成立65周年。近期重點包括6月25日在港珠澳大橋推出「無感e-道」、持續推動人工智能及容貌識別、研究「合作查驗、一次放行」等新通關模式；同時繼續加強反非法勞工、反恐、偽證及遣送工作。面試前應特別留意入境處最新新聞公報，因為最後面試有機會以最近數月政策或行動作追問。", "key": "65周年；無感e-道；AI；合作查驗一次放行；持續執法", "followup": "你認為未來五年入境處最大挑戰是甚麼？", "nature": "最新趨勢", "verified": "46261", "source": "https://www.immd.gov.hk/hkt/press/press_releases.html"}, {"id": "INFO-053", "category": "居留權", "priority": "A 必背", "question": "香港永久性居民享有居留權的人士主要分哪幾類？", "answer": "《入境條例》列出六大類合資格人士，包括在港出生的中國公民、通常居港連續不少於7年的中國公民、上述中國公民在港外出生的中國籍子女、通常居港連續不少於7年並以香港為永久居住地的非中國公民，以及與非中國籍永久居民相關的特定子女類別等。面試毋須逐字背法例，但要掌握「中國籍3類＋非中國籍3類」及7年概念。", "key": "六大類；7年通常居住；中國籍/非中國籍", "followup": "中國籍和非中國籍取得永久居民資格有何分別？", "nature": "法例", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/services/roa/eligible.html"}, {"id": "INFO-054", "category": "居留權", "priority": "B 熟悉", "question": "「通常居住香港連續7年」是否等於7年內完全不能離港？", "answer": "不是。判斷是否「通常居住」會綜合考慮離港原因、時間、頻率、是否在港有慣常居所、是否受僱於香港公司，以及主要家庭成員所在地等。短暫或合理離港不一定中斷通常居住。", "key": "不是零離港；看整體生活重心及離港性質", "followup": "如果長期外派工作，是否仍算通常居港？", "nature": "法例／概念", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/faq/faqroa.html"}, {"id": "INFO-055", "category": "居留權", "priority": "B 熟悉", "question": "非中國籍人士申請香港永久居民，7年以外還有甚麼重要要求？", "answer": "非中國籍人士須在申請前緊接的連續7年通常居於香港，並作出聲明以香港為永久居住地。入境處會考慮是否在港有慣常居所、家庭主要成員、收入及納稅等因素。", "key": "緊接申請前7年；以香港為永久居住地；需聲明", "followup": "為何非中國籍申請人要聲明永久居住地？", "nature": "法例", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/services/right-of-abode-in-hksar/apply.html"}, {"id": "INFO-056", "category": "居留權", "priority": "B 熟悉", "question": "中國公民成為香港永久居民後，長期離港會否自動失去永久居民身份？", "answer": "一般而言，中國公民如已符合永久居民資格，只要仍是中國公民，即使長期不在香港，亦不會單純因長期離港而喪失香港永久居民身份。", "key": "中國籍永久居民不因長期離港自動失去身份", "followup": "這點和非中國籍永久居民有何不同？", "nature": "法例", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/residents/immigration/roa/eligible-position-chinese-not-hold-foreign-passports.html"}, {"id": "INFO-057", "category": "居留權", "priority": "B 熟悉", "question": "甚麼是「核實永久性居民身份證資格」？", "answer": "這是由入境處核實申請人是否符合香港永久性居民及居留權資格的程序。申請人一般需提供身份證、旅行證件，以及可證明出生、通常居住、父母身份或其他相關資格的文件。", "key": "核實資格；文件證明；不是單純換證", "followup": "為何核實資格和申領身份證是兩個概念？", "nature": "程序", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/services/right-of-abode-in-hksar/apply.html"}, {"id": "INFO-058", "category": "居留權", "priority": "B 熟悉", "question": "出生在香港是否一定自動成為香港永久居民？", "answer": "不是。是否享有香港居留權要視乎國籍及父母身份等法定條件。例如在港出生的中國公民屬永久居民類別之一，但其他情況仍需按《入境條例》判斷。", "key": "在港出生≠任何情況都自動永久居民", "followup": "父母身份會如何影響子女的居留權？", "nature": "法例", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/services/roa/eligible.html"}, {"id": "INFO-060", "category": "身份證", "priority": "A 必背", "question": "香港居民一般幾多歲需要登記身份證？", "answer": "一般而言，年滿11歲的香港居民需要登記身份證；持單程證來港而抵港時已年滿11歲的人士，亦須按指定安排辦理首次登記。", "key": "11歲", "followup": "18歲時為何又需要換成人身份證？", "nature": "程序", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/services/hkid/reg_replace.html"}, {"id": "INFO-061", "category": "身份證", "priority": "B 熟悉", "question": "幾多歲需要換領成人身份證？", "answer": "持有11至17歲人士身份證的人士在年滿18歲後，需要按規定換領成人身份證。入境處現時亦讓部分合資格人士使用自助服務站辦理。", "key": "18歲；兒童證換成人證", "followup": "身份證制度如何協助出入境及公共服務？", "nature": "程序／科技", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/services/hkid/reg_replace.html"}, {"id": "INFO-062", "category": "身份證", "priority": "B 熟悉", "question": "智能身份證有甚麼主要功能及優點？", "answer": "智能身份證採用多層防偽設計並在晶片儲存資料，可提升防偽及身份核實能力；亦支援多項電子公共服務，並可配合指紋模版使用e-道，提升通關便利。", "key": "防偽；晶片；電子服務；e-道", "followup": "科技便利與私隱保障應如何平衡？", "nature": "科技", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/services/hkid/smartid.html"}, {"id": "INFO-066", "category": "旅行證件", "priority": "A 必背", "question": "誰有資格申請香港特區護照？", "answer": "香港特區護照基本上簽發予具有中國國籍並享有香港特區居留權、持有效香港永久性居民身份證的人士。面試時重點記住「中國國籍＋香港永久居民」。", "key": "中國國籍；香港永久居民", "followup": "永久居民是否一定有資格申請特區護照？", "nature": "證件資格", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/service/travel_document/apply_for_hksar_passport.html"}, {"id": "INFO-067", "category": "旅行證件", "priority": "B 熟悉", "question": "香港特區護照一般有效幾多年？", "answer": "16歲或以上人士的香港特區護照一般有效10年；16歲以下兒童一般有效5年。任何年齡兒童都需要自己的獨立護照。", "key": "16歲以上10年；16歲以下5年", "followup": "為何兒童不能加在父母護照內？", "nature": "證件", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/service/travel_document/apply_for_hksar_passport.html"}, {"id": "INFO-069", "category": "旅行證件", "priority": "B 熟悉", "question": "免簽或落地簽是否等於必定可以入境當地？", "answer": "不是。免簽或落地簽只是免除預先申請簽證的要求，旅客最終是否獲准入境及可逗留多久，仍由目的地出入境機關按當時規定及個別情況決定。", "key": "最終入境決定權在當地出入境機關", "followup": "這和香港入境管制的原則有何相似？", "nature": "入境原則", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/service/travel_document/visa_free_access.html"}, {"id": "INFO-070", "category": "旅行證件", "priority": "B 熟悉", "question": "甚麼是香港特區簽證身份書？", "answer": "簽證身份書是供不合資格申請香港特區護照、同時無法取得其他國家或地區旅行證件的合資格香港居民使用的旅行證件。", "key": "不是特區護照；供特定香港居民作旅行證件", "followup": "簽證身份書和特區護照最大分別是甚麼？", "nature": "證件", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/service/travel_document/Application_for_HKSAR_Document_of_Identity_for_Visa_Purposes.html"}, {"id": "INFO-072", "category": "旅行證件", "priority": "B 熟悉", "question": "甚麼是香港特區回港證？", "answer": "回港證是供合資格香港居民往返內地及澳門之用的旅行證件，主要適用於已取得居留權或獲准無條件居留的合資格人士。", "key": "往返內地及澳門；合資格香港居民", "followup": "為何不少成年人現時毋須使用回港證？", "nature": "證件", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/service/travel_document/Application_for_HKSAR_Re-entry_Permit.html"}, {"id": "INFO-075", "category": "旅行證件", "priority": "B 熟悉", "question": "2025年入境處簽發多少本香港特區護照？", "answer": "2025年入境處共簽發698,310本香港特區護照。2024年則為910,553本。數字反映旅行證件服務仍是部門非常重要的大型公共服務。", "key": "2025：698,310；2024：910,553", "followup": "如何在高申請量下同時保持準確和效率？", "nature": "統計", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/facts/personal-docs.html"}, {"id": "INFO-081", "category": "出生／死亡／婚姻", "priority": "B 熟悉", "question": "香港婚禮可在哪些地方合法舉行？", "answer": "婚禮可在婚姻登記處由登記官主持、在特許禮拜場所由合資格神職人員主持，或由婚姻監禮人在香港其他地點主持。", "key": "婚姻登記處；特許禮拜場所；婚姻監禮人", "followup": "婚姻監禮人制度帶來甚麼便利？", "nature": "婚姻登記", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/marriage/Registration_of_a_Marriage.html"}, {"id": "INFO-084", "category": "人才／簽證政策", "priority": "A 必背", "question": "高端人才通行證計劃主要分哪三類？", "answer": "高才通A類：申請前一年全年收入達港幣250萬元或以上；B類：合資格大學學士學位，並在申請前5年內有至少3年工作經驗；C類：申請前5年內獲合資格大學學士學位而工作經驗少於3年，並受年度配額限制。", "key": "A：250萬年薪；B：合資格大學+3年經驗；C：畢業5年內、經驗少於3年", "followup": "高才通和一般就業政策最大分別是甚麼？", "nature": "政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/useful_information/admission-schemes-talents-professionals-entrepreneurs.html"}, {"id": "INFO-085", "category": "人才／簽證政策", "priority": "A 必背", "question": "高才通申請時是否一定要先有香港工作？", "answer": "不一定。高才通的設計就是讓符合資格的高端人才在申請時毋須已在香港覓得工作，先來港探索發展機會。", "key": "毋須預先有香港工作", "followup": "這項政策對吸引人才有甚麼優勢和風險？", "nature": "政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/useful_information/admission-schemes-talents-professionals-entrepreneurs.html"}, {"id": "INFO-086", "category": "人才／簽證政策", "priority": "B 熟悉", "question": "高才通首次逗留期限一般是多少？", "answer": "現行安排下，高才通A類一般可獲准逗留36個月；B類及C類一般為24個月，期間不受其他逗留條件限制。", "key": "A類36個月；B/C類24個月", "followup": "續簽時政府應重視哪些因素？", "nature": "政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/useful_information/admission-schemes-talents-professionals-entrepreneurs.html"}, {"id": "INFO-087", "category": "人才／簽證政策", "priority": "A 必背", "question": "一般就業政策主要適用於甚麼人士？", "answer": "一般就業政策主要供有意來港工作的海外、台灣及澳門專業人士申請，計劃不限行業，但通常需有真實職位、相關學歷或專業背景，而薪酬待遇須與香港市場水平相若。", "key": "海外/台灣/澳門專業人士；一般需已有職位", "followup": "一般就業政策和輸入內地人才計劃如何區分？", "nature": "政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/useful_information/admission-schemes-talents-professionals-entrepreneurs.html"}, {"id": "INFO-088", "category": "人才／簽證政策", "priority": "A 必背", "question": "輸入內地人才計劃主要是甚麼？", "answer": "輸入內地人才計劃讓具備香港所需而本地較缺乏的特別技能、知識或經驗的內地專業人士來港工作。一般須由香港僱主提供職位並符合相關入境條件。", "key": "內地專業人才；通常由香港僱主聘用", "followup": "人才政策如何兼顧本地就業？", "nature": "政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/useful_information/admission-schemes-talents-professionals-entrepreneurs.html"}, {"id": "INFO-089", "category": "人才／簽證政策", "priority": "B 熟悉", "question": "非本地畢業生留港／回港就業安排的核心是甚麼？", "answer": "非本地畢業生留港／回港就業安排讓合資格非本地畢業生在香港就業及發展。應屆合資格畢業生一般可在指定期限內申請留港，而回港就業人士則按相關要求申請。", "key": "IANG；吸引在港受教育人才留港", "followup": "為何留住本地培養的非本地畢業生有政策價值？", "nature": "政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/useful_information/admission-schemes-talents-professionals-entrepreneurs.html"}, {"id": "INFO-090", "category": "人才／簽證政策", "priority": "B 熟悉", "question": "優秀人才入境計劃的基本定位是甚麼？", "answer": "優秀人才入境計劃旨在吸引高質素人才來港定居發展，重點是提升香港人才庫及競爭力。與一般就業簽證相比，其政策定位並非單純填補一個指定職位。", "key": "吸引優秀人才；提升人才庫", "followup": "優才與高才通有何異同？", "nature": "政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/useful_information/admission-schemes-talents-professionals-entrepreneurs.html"}, {"id": "INFO-093", "category": "訪客／逗留條件", "priority": "A 必背", "question": "一般訪港旅客可否在港工作？", "answer": "一般訪港旅客不得在香港從事任何僱傭工作，不論有薪或無薪，亦不得開設或參與任何業務或入學就讀；除極特殊情況外，抵港後亦不會獲准改變訪客身份。", "key": "訪客不得工作、做生意或就讀", "followup": "如果朋友叫訪客『幫手』幾小時但不收錢，是否可以？", "nature": "逗留條件", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/services/visas/visit-transit/visit-visa-entry-permit.html"}, {"id": "INFO-094", "category": "訪客／逗留條件", "priority": "A 必背", "question": "一般訪港旅客入境時要具備甚麼基本條件？", "answer": "一般旅客須符合入境規定，包括持有效旅行證件、按其國籍符合簽證要求、具備足夠旅費，以及在適用情況下持續程或回程交通安排。最終是否准予入境由入境機關按個別情況決定。", "key": "有效證件；簽證要求；足夠旅費；續程/回程安排", "followup": "如果旅客文件齊全，是否代表一定准入境？", "nature": "入境管制", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/services/visas/visit-transit/visit-visa-entry-permit.html"}, {"id": "INFO-095", "category": "受養人", "priority": "B 熟悉", "question": "哪些受養人一般可在港工作而毋須另行取得入境處批准？", "answer": "香港永久居民、不受逗留期限約束的香港居民，以及多類獲准來港就業、投資或人才計劃人士的受養人，一般可在港工作而不受限制；但以學生身份來港人士的受養人如欲工作，通常須先獲入境處批准。", "key": "多數就業/人才計劃受養人可工作；學生受養人例外", "followup": "為甚麼不同受養人有不同就業條件？", "nature": "政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/services/visas/residence_as_dependant.html"}, {"id": "INFO-097", "category": "受養人", "priority": "B 熟悉", "question": "受養人在香港通常居住滿7年後可否申請居留權？", "answer": "如符合法例，獲准以受養人身份在港居住並通常居住連續不少於7年的人士，可依法申請香港居留權；最終仍須視乎國籍及其他法定條件。", "key": "通常居住7年；仍須符合法定條件", "followup": "逗留身份和永久居民身份有何分別？", "nature": "居留權", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/services/visas/residence_as_dependant.html"}, {"id": "INFO-101", "category": "法例／非法工作", "priority": "A 必背", "question": "非法勞工一經定罪最高可被判甚麼刑罰？", "answer": "非法入境者、受遣送令或遞解離境令規限者、逾期逗留者或被拒入境人士如非法工作，可被檢控；相關非法工作罪行最高可判罰款港幣50,000元及監禁3年。", "key": "最高$50,000；監禁3年", "followup": "非法工作除了個人刑責外還可能有甚麼後果？", "nature": "法例", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20260210.html"}, {"id": "INFO-102", "category": "法例／非法工作", "priority": "A 必背", "question": "僱主聘用不可合法受僱人士的最高刑罰是多少？", "answer": "現行《入境條例》下，僱主聘用不可合法受僱人士的最高刑罰為罰款港幣500,000元及監禁10年。公司董事、經理、秘書、合夥人等亦可能承擔刑事責任。", "key": "最高$500,000；監禁10年", "followup": "僱主在聘用前應做甚麼核實？", "nature": "法例", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20260210.html"}, {"id": "INFO-103", "category": "法例／非法工作", "priority": "B 熟悉", "question": "法院對聘用非法勞工的僱主有甚麼量刑原則？", "answer": "上訴庭曾重申，聘用不可合法受僱人士屬嚴重罪行，即使初犯亦可判即時監禁；僱主應採取一切切實可行步驟核實求職者是否可以合法受僱。", "key": "初犯亦可即時監禁；僱主須盡核實責任", "followup": "如果僱主聲稱不知道證件是假的，是否一定免責？", "nature": "法例／判刑原則", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20240911.html"}, {"id": "INFO-104", "category": "法例／偽證", "priority": "A 必背", "question": "使用或管有偽造香港身份證的最高刑罰是甚麼？", "answer": "使用或管有偽造香港身份證，或使用屬於他人的香港身份證，均可構成嚴重罪行；一經定罪最高可被罰款港幣100,000元及監禁10年。", "key": "最高$100,000；監禁10年", "followup": "IA在前線如何識別及處理懷疑偽證？", "nature": "法例", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20230418.html"}, {"id": "INFO-105", "category": "法例／虛假申述", "priority": "A 必背", "question": "向入境處職員作出虛假申述最高刑罰是多少？", "answer": "任何人士如明知內容虛假或不相信為真仍向入境處職員作出虛假陳述或申述，可被檢控；一經定罪最高罰款港幣150,000元及監禁14年，協助及教唆者亦可負同樣刑責。", "key": "最高$150,000；監禁14年", "followup": "為甚麼入境申請中的誠信要求特別高？", "nature": "法例", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20260708.html"}, {"id": "INFO-106", "category": "法例／假結婚", "priority": "A 必背", "question": "假結婚可能涉及哪些主要刑事罪行？", "answer": "假結婚常見可能涉及向入境處作虛假申述、為促成婚姻作虛假誓言或聲明，以及串謀詐騙。向入境處虛假申述最高可判14年及罰款15萬元；串謀詐騙最高可判14年；為取得婚姻相關證明而故意作虛假誓言或聲明最高可判監禁7年及罰款。", "key": "虛假申述14年；串謀詐騙14年；虛假婚姻聲明7年", "followup": "本地居民只是收錢配合假結婚也會有刑責嗎？", "nature": "法例", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20251117.html"}, {"id": "INFO-107", "category": "法例／假結婚", "priority": "B 熟悉", "question": "透過假結婚騙取的香港居民身份會有甚麼後果？", "answer": "如有人以欺詐方式取得香港居民身份，其香港身份證及居留資格可依法被取消，並可被遣返原居地；刑事責任亦可另外追究。", "key": "取消身份證及居留資格；遣返；另有刑責", "followup": "這反映入境處在身份管理上有甚麼原則？", "nature": "執法", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20260708.html"}, {"id": "INFO-108", "category": "大型行動", "priority": "B 熟悉", "question": "2026年「銳鋒」行動是甚麼？", "answer": "入境處聯同廣東及珠海出入境執法機關搗破跨境偽證集團。調查由2025年延續至2026年，香港一方以「銳鋒」行動搜查多個住宅及工作地點；整體聯合行動共拘捕119人，並檢獲大量偽證製造設備及偽造證件。", "key": "銳鋒；跨境偽證；119人", "followup": "跨境偽證集團為何對香港邊境安全構成重大風險？", "nature": "跨境執法", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/press/press-releases/20260205.html"}, {"id": "INFO-110", "category": "執法統計", "priority": "B 熟悉", "question": "2025年有多少非法勞工及僱主被檢控？", "answer": "2025年有1,084名非法勞工被檢控（不包括性工作者），另有179名非法勞工僱主被檢控。", "key": "非法勞工1,084；僱主179", "followup": "只打擊非法勞工，不追究僱主是否足夠？", "nature": "統計／執法", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/facts/enforcement.html"}, {"id": "INFO-114", "category": "免遣返", "priority": "A 必背", "question": "統一審核機制何時開始運作？", "answer": "統一審核機制於2014年3月3日開始運作，由入境處一次過按所有適用理由審核受遣送或遞解人士提出的免遣返保護聲請。", "key": "2014-03-03", "followup": "為何要設立統一而不是多套分開的審核機制？", "nature": "政策／歷史", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/useful_information/non-refoulement-making-claim.html"}, {"id": "INFO-115", "category": "免遣返", "priority": "A 必背", "question": "香港是否設有一般難民庇護制度？", "answer": "香港政府立場是《1951年難民公約》及其1967年議定書從未適用於香港，香港不審定一般難民身份亦不給予庇護；但會依法透過統一審核機制處理適用的免遣返聲請。", "key": "不設一般難民庇護；依法處理免遣返", "followup": "這和『拒絕所有聲請』有甚麼分別？", "nature": "政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/useful_information/non-refoulement-making-claim.html"}, {"id": "INFO-116", "category": "免遣返", "priority": "B 熟悉", "question": "截至2026年6月底，尚有多少宗免遣返聲請未完成？", "answer": "官方統計顯示，截至2026年6月底，累計尚有194宗酷刑／免遣返聲請未完成。2026年1至6月有567宗新聲請，948宗獲決定，另有60宗撤回或不再處理。", "key": "未完成194；2026上半年新567、決定948、撤回60", "followup": "為何政府重視縮短積壓時間？", "nature": "統計", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/facts/enforcement.html"}, {"id": "INFO-117", "category": "通關統計", "priority": "B 熟悉", "question": "2025年香港各管制站總出入境人次約多少？", "answer": "2025年香港各管制站總出入境人次約3.35億，較2024年增加約12%，並創歷史新高，超越2019年約3億人次水平。", "key": "約3.35億；+12%；歷史新高", "followup": "人流創新高對IA最直接的挑戰是甚麼？", "nature": "統計", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20260213.html"}, {"id": "INFO-118", "category": "通關統計", "priority": "B 熟悉", "question": "2025年訪港旅客約多少人？內地旅客佔多少？", "answer": "2025年訪港旅客約4,989萬人次，其中內地旅客約3,783萬，其他旅客約1,206萬。", "key": "總4,989萬；內地3,783萬；其他1,206萬", "followup": "旅客結構對管制站人手配置有甚麼影響？", "nature": "統計", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20260213.html"}, {"id": "INFO-123", "category": "電子服務", "priority": "B 熟悉", "question": "智能身份證如何支援e-道？", "answer": "智能身份證晶片可儲存指紋模版等資料，讓合資格持證人使用旅客自助出入境檢查系統及車輛司機自助出入境檢查系統，提升通關效率。", "key": "晶片；指紋模版；e-道", "followup": "若自助系統失效，IA應如何維持運作？", "nature": "科技", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/services/hkid/smartid.html"}, {"id": "INFO-128", "category": "非法入境", "priority": "B 熟悉", "question": "近年來自內地的非法入境人數趨勢如何？", "answer": "官方資料顯示，來自內地的非法入境者由2021年的1,376人下降至2022年673人、2023年351人、2024年251人；數字會受邊境環境及執法情況影響。", "key": "2021：1,376；2024：251", "followup": "非法入境數字下降是否代表可以減少邊境戒備？", "nature": "統計", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/publications/a_report_2024/en/appendix14.html"}, {"id": "INFO-129", "category": "部門職能", "priority": "B 熟悉", "question": "個人證件部主要負責甚麼？", "answer": "個人證件相關工作包括香港特區護照及其他旅行證件、國籍法相關事宜、出生死亡婚姻登記、居留權及身份證服務，以及與外國政府商討特區護照免簽安排和境外港人支援等。", "key": "旅行證件；國籍；生死婚姻；居留權；身份證；免簽；境外支援", "followup": "哪一部分工作最需要前線服務技巧？", "nature": "架構", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/publications/a_report_2024/en/chapter4.html"}, {"id": "INFO-132", "category": "面試總結", "priority": "A 必背", "question": "如果面試官問「你認為現時入境處面對的主要挑戰是甚麼？」可怎樣以事實作答？", "answer": "可從四方面回答：第一，2025年出入境人次約3.35億創新高，要同時維持效率與安全；第二，非法勞工、偽證、假結婚及跨境犯罪手法持續轉變；第三，高才通等人才政策帶來大量簽證及居留服務需求；第四，AI、容貌識別及無感e-道加速數碼化，需要兼顧系統韌性、資料保障及市民信任。最後可連結IA角色：準確執行程序、保持警覺、服務旅客、適應科技及團隊協作。", "key": "3.35億通關；跨境執法；人才政策；科技與私隱", "followup": "如果只可選一個最大挑戰，你會選哪個？為甚麼？", "nature": "整合題", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/press/press-releases/20260213.html"}, {"id": "INFO-134", "category": "管制站歷史", "priority": "B 熟悉", "question": "高鐵西九龍管制站採用甚麼出入境安排？", "answer": "高鐵西九龍採用「一地兩檢」安排，旅客可在同一管制站內完成香港及內地的出入境檢查。它是繼深圳灣後另一個採用一地兩檢模式的重要管制站。", "key": "一地兩檢", "followup": "一地兩檢對旅客及執法人員有甚麼好處和挑戰？", "nature": "通關模式", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/publications/a_report_60/eng/84/"}, {"id": "INFO-136", "category": "管制站歷史", "priority": "B 熟悉", "question": "港珠澳大橋採用甚麼清關模式？", "answer": "港珠澳大橋採用「三地三檢／各自設置邊檢設施」的分置模式，各地政府在自己境內設置出入境設施，與高鐵西九龍的一地兩檢不同。", "key": "各地分置檢查；不同於一地兩檢", "followup": "不同清關模式對前線工作安排有何影響？", "nature": "通關模式", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/publications/a_report_2024/en/chapter3.html"}, {"id": "INFO-138", "category": "疫情／通關史", "priority": "B 熟悉", "question": "香港與內地正常通關在疫情後何時全面恢復？", "answer": "疫情後，香港與內地於2023年1月8日起分階段恢復正常通關，並於2023年2月6日起全面恢復正常人員往來。", "key": "2023-01-08分階段；2023-02-06全面恢復", "followup": "大型公共衞生事件會如何改變入境處工作？", "nature": "歷史／危機管理", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/publications/a_report_2023/en/service.html"}, {"id": "INFO-141", "category": "IA職級", "priority": "A 必背", "question": "入境事務助理員職系由低至高主要是哪三個職級？", "answer": "入境事務助理員職系主要包括入境事務助理員、高級入境事務助理員及總入境事務助理員。", "key": "IA→Senior IA→Chief IA", "followup": "你對IA長期晉升及職涯有何理解？", "nature": "職級", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/rank_insignia.html"}, {"id": "INFO-142", "category": "IA招聘", "priority": "A 必背", "question": "新聘入境事務助理員試用期一般幾耐？", "answer": "新聘入境事務助理員按公務員試用條款受聘，試用期為3年；完成試用期並表現滿意者可獲考慮按當時適用的長期聘用條款受聘。", "key": "3年試用期", "followup": "試用期內你認為最需要證明甚麼？", "nature": "招聘／聘用條款", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/recruitment/"}, {"id": "INFO-145", "category": "IA招聘", "priority": "A 必背", "question": "《基本法及香港國安法》測試與公務員招聘有何關係？", "answer": "所有應徵公務員職位人士均須接受《基本法及香港國安法》知識測試；取得及格成績是獲考慮聘用的入職條件之一。未曾應考或未及格者仍可先申請職位，並會在招聘過程中獲安排參加相關測試。", "key": "所有公務員；及格是入職條件", "followup": "紀律部隊人員為何要理解基本法及國安法？", "nature": "招聘／公務員要求", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/recruitment/"}, {"id": "INFO-149", "category": "外籍家庭傭工", "priority": "B 熟悉", "question": "外傭可否替其他僱主兼職？", "answer": "不可以。外傭只可為標準僱傭合約指定的僱主提供合約列明的家務工作，並不得替其他人士從事其他僱傭工作。", "key": "只能為指定僱主工作；不可兼職", "followup": "如果僱主批准外傭到親戚家幫手是否可以？", "nature": "逗留條件", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/services/visas/foreign_domestic_helpers.html"}, {"id": "INFO-152", "category": "面試總結", "priority": "A 必背", "question": "如果面試官問「IA最核心的三項能力是甚麼？」可如何結合官方職責作答？", "answer": "可答：第一是紀律與誠信，因IA執行法例、接觸身份及出入境資料，必須守程序及保密；第二是警覺與判斷，因工作涉及偽證、非法入境、非法工作及突發事件；第三是溝通與服務，因IA同時要接待大量市民和旅客，並在高人流及壓力下保持清晰、禮貌和公平。再補充體能、團隊協作及適應科技亦非常重要。", "key": "紀律誠信；警覺判斷；溝通服務", "followup": "你可以用自己過往工作各舉一例證明這三項能力嗎？", "nature": "整合題", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/hkt/recruitment/"}, {"id": "INFO-153", "category": "航空邊境保安", "priority": "A 必背", "question": "甚麼是「預先旅客資料（API）系統」？有甚麼作用？", "answer": "入境處於2024年9月3日實施互動式預先旅客資料（Advance Passenger Information, API）系統。來港航班的航空公司在旅客辦理登機手續期間，須把指定旅行證件資料及航班資料傳送予入境處；系統會即時作邊境保安風險評估並向航空公司發出「准予登機」或「不准登機」指示。制度是配合國際民航組織要求，目的包括在旅客抵港前識別風險、阻止不受歡迎人士登機及提升抵港清關效率。相關規例的罪行及罰則部分於2025年9月1日起生效。擁有香港居留權的人士不會被發出不准登機指示。", "key": "2024-09-03實施；來港航班；登機前風險評估；Board/No-board；2025-09-01全面罰則生效", "followup": "API系統如何同時提升邊境安全及通關效率？", "nature": "最新科技／邊境保安", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/useful_information/apis.html"}, {"id": "INFO-154", "category": "內地居民來港", "priority": "A 必背", "question": "內地居民來港定居的「單程證」由誰審批？每日配額是多少？", "answer": "內地居民如希望來港定居，須向其戶籍所在地的內地公安機關申請《前往港澳通行證》，即俗稱「單程證」。單程證的審批及簽發由內地有關機關按內地法律、政策及規定負責，而不是由香港入境事務處審批。現行每日單程證配額為150個。這反映香港與內地在出入境管理上的職權分工。", "key": "內地公安機關審批；香港入境處不負責審批；每日150個", "followup": "如果有人話單程證是香港入境處批出的，你會如何糾正？", "nature": "核心入境政策", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/services/visas/overseas-chinese-entry-arrangement.html"}, {"id": "INFO-155", "category": "反恐／邊境保安", "priority": "A 必背", "question": "入境處在反恐及保障邊境安全方面有甚麼角色？", "answer": "入境處除了提供出入境服務，亦是香港邊境保安的重要一環。部門會在各管制站根據情報及風險評估截查和進一步檢查可疑旅客，防止涉及恐怖活動或其他嚴重風險的人士進入香港；同時打擊偽造旅行證件、非法入境及相關跨境罪行，並透過反恐演習及培訓提升前線人員警覺性和應變能力。近年亦利用API等系統在旅客抵港前進行風險評估。面試重點應理解：通關效率重要，但不能犧牲安全、程序及身份核實。", "key": "情報風險評估；截查可疑旅客；偽證／非法入境；反恐訓練；安全不能為效率讓路", "followup": "繁忙時段出現可疑旅客，你會點平衡長龍同安全檢查？", "nature": "部門核心職能", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/publications/a_report_2024/en/chapter5.html"}, {"id": "INFO-156", "category": "訪客／逗留條件", "priority": "B 熟悉", "question": "一般訪客如果違反逗留條件，最高刑罰是多少？", "answer": "一般以訪客身分獲准入境的人士不得受僱、開辦或參與業務，以及不得就讀學校、大學或其他教育機構，除非符合特定便利安排。根據《入境條例》第41條，違反有效逗留條件的人士一經定罪，最高可被判罰款港幣50,000元及監禁2年。要留意這個刑罰與非法入境者、逾期逗留者等在第38AA條下非法工作的最高監禁3年並不完全相同。", "key": "訪客違反逗留條件：最高$50,000＋監禁2年；與38AA非法工作刑罰要分清", "followup": "旅客話只是無薪幫朋友工作，是否可以？", "nature": "法例／逗留條件", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/faq/visit-transit.html"}, {"id": "INFO-157", "category": "面試總結", "priority": "A 必背", "question": "如果面試官問「入境處應如何平衡通關便利與邊境安全？」可以怎樣答？", "answer": "我認為兩者不是二選一，而應該用「風險為本」方式同時做到。第一，對一般低風險旅客可利用e-道、無感e-道及數碼服務提升效率，減少不必要等候；第二，利用API、情報及系統風險評估，在旅客抵港前或通關時識別較高風險個案，把前線人手集中在需要深入檢查的人士；第三，無論人流多大，身份核實、法定程序及安全要求都不能因追求速度而降低。IA的角色就是在高人流環境下保持禮貌及效率，同時具備警覺性，發現異常即按程序處理或向上級求助。", "key": "風險為本；科技便利低風險旅客；情報集中資源；程序及安全不可犧牲", "followup": "如果因為加強檢查令大量旅客投訴，你會怎樣處理？", "nature": "高機會整合題", "verified": "2026-08-27", "source": "https://www.immd.gov.hk/eng/useful_information/apis.html"}];

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let reviewOnly=false,allOpen=false;
function filteredList(){const q=document.getElementById('search').value.trim().toLowerCase(),p=document.getElementById('priorityFilter').value,c=document.getElementById('categoryFilter').value;return DATA.filter(x=>(!p||x.priority.startsWith(p))&&(!c||x.category===c)&&(!reviewOnly||state[x.id]!=='mastered')&&(!q||[x.id,x.category,x.question,x.answer,x.key,x.followup].join(' ').toLowerCase().includes(q)))}
function renderList(){const rows=filteredList(),box=document.getElementById('cards');document.getElementById('resultMeta').textContent=`顯示 ${rows.length} / ${DATA.length} 題`;box.innerHTML=rows.length?rows.map(x=>{const st=state[x.id]||'';return `<details class="qa" ${allOpen?'open':''}><summary><div class="rowtop"><span class="badge ${x.priority.startsWith('A')?'a':'b'}">${esc(x.priority)}</span><span class="badge cat">${esc(x.category)}</span><div class="qtext">${esc(x.question)}</div><span class="state-dot ${st}"></span></div></summary><div class="answer"><h4>完整標準答案</h4><p>${esc(x.answer)}</p><div class="keybox"><b>必記重點：</b>${esc(x.key)}</div><div class="follow"><b>面試延伸問法：</b>${esc(x.followup)}</div><div class="card-actions"><button class="btn good" onclick="setState('${x.id}','mastered')">已掌握 ✓</button><button class="btn warn" onclick="setState('${x.id}','review')">要再溫</button><button class="btn ghost" onclick='speakText(${JSON.stringify(x.question)})'>🔊 朗讀</button></div><div class="source"><span>${esc(x.id)} · ${esc(x.nature)} · 最後核實 ${esc(x.verified)}</span>${x.source?`<a target="_blank" rel="noopener" href="${esc(x.source)}">官方來源 ↗</a>`:''}</div></div></details>`}).join(''):'<div class="empty">沒有符合條件的題目。</div>'}
['search','priorityFilter','categoryFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',renderList));
document.getElementById('onlyReview').onclick=e=>{reviewOnly=!reviewOnly;e.target.textContent=reviewOnly?'顯示全部':'只看未熟';e.target.className='btn '+(reviewOnly?'warn':'secondary');renderList()};
document.getElementById('expandAll').onclick=e=>{allOpen=!allOpen;e.target.textContent=allOpen?'收起全部答案':'展開全部答案';renderList()};
function speakText(t){if(!('speechSynthesis' in window))return alert('此瀏覽器不支援朗讀功能');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=.92;speechSynthesis.speak(u)}
let deck=[],fi=0;
function buildFlashDeck(){const p=document.getElementById('flashPriority').value,c=document.getElementById('flashCategory').value;deck=DATA.filter(x=>(!p||x.priority.startsWith(p))&&(!c||x.category===c));if(document.getElementById('flashUnmastered').dataset.on==='1')deck.sort((a,b)=>(state[a.id]==='mastered')-(state[b.id]==='mastered'));fi=Math.min(fi,Math.max(0,deck.length-1));showFlash()}
function showFlash(){if(!deck.length)return;const x=deck[fi];document.getElementById('flashMeta').textContent=`${fi+1} / ${deck.length} · ${x.id} · ${x.priority} · ${x.category}`;document.getElementById('flashProgress').style.width=(100*(fi+1)/deck.length)+'%';document.getElementById('flashQuestion').textContent=x.question;document.getElementById('flashAnswer').classList.remove('show');document.getElementById('flashAnswer').innerHTML=`<h4>標準答案</h4><p>${esc(x.answer)}</p><div class="keybox"><b>必記：</b>${esc(x.key)}</div><div class="follow"><b>追問：</b>${esc(x.followup)}</div>`;document.getElementById('revealFlash').textContent='顯示答案'}
document.getElementById('flashPriority').onchange=buildFlashDeck;document.getElementById('flashCategory').onchange=buildFlashDeck;document.getElementById('revealFlash').onclick=e=>{let a=document.getElementById('flashAnswer');a.classList.toggle('show');e.target.textContent=a.classList.contains('show')?'隱藏答案':'顯示答案'};document.getElementById('nextFlash').onclick=()=>{if(deck.length)fi=(fi+1)%deck.length;showFlash()};document.getElementById('prevFlash').onclick=()=>{if(deck.length)fi=(fi-1+deck.length)%deck.length;showFlash()};document.getElementById('shuffleFlash').onclick=()=>{deck.sort(()=>Math.random()-.5);fi=0;showFlash()};document.getElementById('flashUnmastered').onclick=e=>{e.target.dataset.on=e.target.dataset.on==='1'?'0':'1';e.target.textContent=e.target.dataset.on==='1'?'優先未熟 ✓':'優先未熟';buildFlashDeck()};document.getElementById('masterFlash').onclick=()=>{if(deck[fi]){state[deck[fi].id]='mastered';save();document.getElementById('nextFlash').click()}};document.getElementById('reviewFlash').onclick=()=>{if(deck[fi]){state[deck[fi].id]='review';save();document.getElementById('nextFlash').click()}};document.getElementById('speakFlash').onclick=()=>deck[fi]&&speakText(deck[fi].question);
let quizDeck=[],qi=0;
function startQuiz(){const p=document.getElementById('quizPriority').value,c=document.getElementById('quizCategory').value,n=+document.getElementById('quizCount').value;quizDeck=DATA.filter(x=>(!p||x.priority.startsWith(p))&&(!c||x.category===c)).sort(()=>Math.random()-.5).slice(0,n);qi=0;showQuiz()}
function showQuiz(){if(!quizDeck.length)return;const x=quizDeck[qi];document.getElementById('quizMeta').textContent=`第 ${qi+1} / ${quizDeck.length} 題 · ${x.id} · ${x.priority} · ${x.category}`;document.getElementById('quizQuestion').textContent=x.question;document.getElementById('quizInput').value='';document.getElementById('quizAnswer').classList.remove('show');document.getElementById('quizAnswer').innerHTML=`<h4>標準答案</h4><p>${esc(x.answer)}</p><div class="keybox"><b>必記重點：</b>${esc(x.key)}</div>`;document.getElementById('quizScore').style.display='none'}
document.getElementById('startQuiz').onclick=startQuiz;document.getElementById('quizReveal').onclick=()=>{if(!quizDeck.length)return;document.getElementById('quizAnswer').classList.add('show');document.getElementById('quizScore').style.display='grid'};document.getElementById('quizSpeak').onclick=()=>quizDeck[qi]&&speakText(quizDeck[qi].question);document.querySelectorAll('#quizScore button').forEach(b=>b.onclick=()=>{if(!quizDeck.length)return;const sc=+b.dataset.score,id=quizDeck[qi].id;if(sc===2){quizStats.correct++;state[id]='mastered'}else if(sc===1){quizStats.partial++;state[id]='review'}else{quizStats.wrong++;state[id]='review'}localStorage.setItem(QUIZ_KEY,JSON.stringify(quizStats));save();qi++;if(qi>=quizDeck.length){alert('完成今輪測驗！');qi=0;quizDeck.sort(()=>Math.random()-.5)}showQuiz()});
document.getElementById('exportProgress').onclick=()=>{const payload={exportedAt:new Date().toISOString(),progress:state,quizStats};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='IA_study_progress.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('resetProgress').onclick=()=>{if(confirm('確定清除所有本機溫習進度？')){state={};quizStats={correct:0,partial:0,wrong:0};localStorage.removeItem(LS_KEY);localStorage.removeItem(QUIZ_KEY);refreshStats();renderList()}};
refreshStats();renderList();buildFlashDeck();
</script></body></html>

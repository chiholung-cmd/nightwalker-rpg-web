name: Nightwalker free-AI regression
on:
  pull_request:
    paths:
      - 'lab-p0-p4/**'
      - '.github/workflows/nightwalker-ai-ci.yml'
  push:
    branches: [main]
    paths:
      - 'lab-p0-p4/**'
      - '.github/workflows/nightwalker-ai-ci.yml'
permissions:
  contents: read
jobs:
  quota-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Node and syntax
        run: |
          node --version
          node --check lab-p0-p4/app.js
          node --check lab-p0-p4/api/story.mjs
          node --check lab-p0-p4/story.js
          node --check lab-p0-p4/engine.js
          node --check lab-p0-p4/worldState.js
      - name: Groq free-tier mocks and regression tests
        run: node --test lab-p0-p4/tests/*.test.mjs

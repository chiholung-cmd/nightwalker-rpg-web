name: Nightwalker AI Regression Tests
on:
  pull_request:
    paths:
      - 'lab-p0-p4/api/story.mjs'
      - 'lab-p0-p4/app.js'
      - 'lab-p0-p4/tests/**'
      - '.github/workflows/nightwalker-ai-tests.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ai-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm runtime
        run: node --version
      - name: Parse Story API and App
        run: |
          node --check lab-p0-p4/api/story.mjs
          node --check lab-p0-p4/app.js
      - name: Verify free-tier model failover and cooldown
        working-directory: lab-p0-p4
        run: node --test tests/ai-rate-limit.test.mjs

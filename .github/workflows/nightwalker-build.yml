name: Nightwalker build check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate world graph and branching choices
        run: node scripts/validate-story.cjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Validate story graph and progression
        run: node scripts/check-story.cjs
      - name: Build
        run: npm run build
